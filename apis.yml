name: Edviro
description: >-
  Edviro is an AI platform for building operations and energy optimization,
  aimed at facility managers and building operators of large commercial
  buildings. It pulls scattered building data - utility bills, smart meters,
  building management systems (BMS), submeters, sensors, and work-order
  platforms - into one place, then follows an Ingest, Detect, Act, and Verify
  workflow: it consolidates the data, catches energy waste and anomalies in
  real time, dispatches work orders and adjusts setpoints, and proves the
  resulting savings against meter data and utility bills. The platform also
  builds a digital twin of each building to simulate capital projects and
  forecast ROI before purchase, and produces audit-grade Measurement and
  Verification (M&V) reporting. Edviro is a Y Combinator (Summer 2026) company
  founded in 2025 and based in San Francisco.
